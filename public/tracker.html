<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Wrangler — tracker</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 52rem; padding: 1.5rem; line-height: 1.45; }
    h1 { font-size: 1.3rem; }
    .muted { color: #8b93a7; font-size: 0.85rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.75rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #2a2f3d; font-size: 0.9rem; }
    .pill { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 0.8rem; font-size: 0.75rem; background: #262b3a; }
    .gate { color: #ffd479; }
    footer { margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Career Wrangler — tracker</h1>
  <p class="muted" id="status">loading…</p>

  <section>
    <h2>Submissions</h2>
    <table>
      <thead><tr><th>posting</th><th>company</th><th>status</th><th>created</th></tr></thead>
      <tbody id="submissions"></tbody>
    </table>
  </section>

  <section>
    <h2>Open human gates</h2>
    <p class="muted" id="gate-note">none (approve / resend / close land in slice 4)</p>
    <ul id="gates"></ul>
  </section>

  <footer>
    <span class="pill" id="fk">foreign_keys: …</span>
    <span class="muted">slice 1 skeleton — read-only over SQLite (node:sqlite)</span>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function load() {
      try {
        const [tracker, health] = await Promise.all([
          fetch('/api/tracker').then((r) => r.json()),
          fetch('/api/health').then((r) => r.json()),
        ]);
        $('status').textContent = `${tracker.submissions.length} submissions · ${tracker.postings.length} postings`;
        $('fk').textContent = `foreign_keys: ${health.foreign_keys ? 'ON' : 'OFF (bug!)'} · ${health.tables.length} tables`;

        $('submissions').innerHTML = tracker.submissions.map((s) => `
          <tr>
            <td>${esc(s.posting_title)}</td>
            <td>${esc(s.posting_company)}</td>
            <td><span class="pill">${esc(s.status)}${s.approved_by ? ' ✓' : ''}</span></td>
            <td class="muted">${s.created_at ? new Date(s.created_at).toLocaleString() : '—'}</td>
          </tr>`).join('') || '<tr><td colspan="4" class="muted">no submissions yet</td></tr>';

        if (tracker.gates.length) {
          $('gate-note').textContent = '';
          $('gates').innerHTML = tracker.gates.map((g) => `
            <li class="gate">${esc(g.kind)}: ${esc(g.ask)} — opened ${new Date(g.opened_at).toLocaleString()}</li>`).join('');
        } else {
          $('gates').innerHTML = '';
        }
      } catch (err) {
        $('status').textContent = `failed to load: ${err.message}`;
      }
    }

    load();
    setInterval(load, 10_000); // refresh while the pipeline is active
  </script>
</body>
</html>
